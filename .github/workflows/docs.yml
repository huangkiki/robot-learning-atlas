name: Course checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_docs.py
      - run: python -m compileall -q scripts mjlab/examples learning/examples
      - run: python learning/examples/rollout_math.py
      - run: git show --format= --check HEAD
